# Mask2Former com backbone Swin-T (pesos do ImageNet). Use pretrained: null para treinar do zero.
# amp começa desligado por estabilidade (operações de atenção deformável); testar ligá-lo no Colab.
arch: mask2former
model:
  pretrained: microsoft/swin-tiny-patch4-window7-224
  num_queries: 20
  drop_path_rate: 0.1
train:
  lr: 1.0e-4
  batch_size: 8
  weight_decay: 1.0e-4
  amp: false
  grad_clip: 1.0
